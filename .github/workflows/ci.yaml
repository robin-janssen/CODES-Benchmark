name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Check formatting
        run: |
          uv sync --locked --only-group dev
          uv run --no-sync black --check .
          uv run --no-sync isort --check-only .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CODES and its locked dependencies
        run: uv sync --locked

      - name: Run pytest and generate coverage report
        run: uv run --no-sync pytest --cov=codes --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml test/

      - name: Upload results to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Pull requests from forks have no access to the token; don't fail them.
          fail_ci_if_error: false

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to gh-pages

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install CODES and its locked dependencies
        run: uv sync --locked

      - name: Generate API Documentation with Sphinx
        run: |
          mkdir -p docs/source/api
          uv run --no-sync sphinx-apidoc -o docs/source/api codes

      - name: Build HTML with Sphinx
        run: uv run --no-sync sphinx-build -b html docs/source docs/_build/html

      # Pull requests only build the docs; pushes to main also deploy them.
      - name: Deploy docs to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
          user_name: "GitHub Actions"
          user_email: "actions@github.com"
          force_orphan: false
